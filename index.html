<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Randomized Table</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="container">
    <div id="table-container">
      <div id="note">1 & 2 are the time periods of their respective letter.<br>X & Y are the divisions of their
        respective letter in each period.</div>
      <div id="table"></div>
    </div>
    <div class="questions"></div>
    <div class="answer">
      <span id="feedback"></span>
      <br>
      <input type="text" id="answerInput" placeholder="Your answer">
      <button id="submitAnswerButton">Check Answer</button>
    </div>
    <div id="buttons">
      <button id="answerButton">Show Answer</button>
      <button id="questionButton">New Question</button>
      <button id="randomizeButton">Randomize Data</button>
    </div>
    <div id="infos">
      <div id="last-time">Last time spent : 00:00</div>
      <div id="total-time">Total time spent : 00:00</div>
      <div id="score">Score : 0/0</div>
    </div>
  </div>
  <a class="home" href="https://rendrakb.github.io/data-quizzes/">« Back to Home</a>
  <div class="footer">RendraKB-2025</div>
  <script src="main.js"></script>
</body>
</html>
